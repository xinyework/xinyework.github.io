<html style="font-size: 100px;">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Xinye Games - Sudoku Master & Poker Solitaire</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.ico">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{width:100%;height:100%}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            min-height:100vh;background:#fff
        }
        .apps-wrapper{
            display:flex;flex-direction:row;justify-content:center;align-items:flex-start;
            width:100%;max-width:1400px;flex:1;padding:0 20px
        }
        .app-card{
            flex:1;display:flex;flex-direction:column;align-items:center;
            padding:60px 40px 40px;text-align:center;max-width:50%
        }
        .app-card .banner{
            width:100%;max-width:340px;margin-bottom:36px
        }
        .app-card .banner img{width:100%;height:auto;display:block}
        .app-card .app-title{
            font-size:38px;font-weight:600;color:#1a1a1a;margin-bottom:14px;line-height:1.2
        }
        .app-card .app-desc{
            font-size:18px;color:rgba(0,0,0,0.5);margin-bottom:28px;line-height:1.6
        }
        .app-card .store{display:flex;justify-content:center;gap:12px}
        .app-card .store img{height:50px}
        .footer-section{width:100%;text-align:center;padding:30px 20px 36px}
        .footer-links{color:rgba(0,0,0,0.4);font-size:14px;line-height:2}
        .footer-links a{color:inherit;text-decoration:none;margin:0 6px}
        .footer-links a:hover{color:#5067ed}
        .footer-links .split{margin:0 4px;user-select:none}

        @media (max-width:720px){
            body{justify-content:flex-start}
            .apps-wrapper{flex-direction:column;align-items:center;padding:0 16px}
            .app-card{padding:40px 16px 30px;max-width:420px}
            .app-card .banner{max-width:240px;margin-bottom:24px}
            .app-card .app-title{font-size:28px}
            .app-card .app-desc{font-size:15px;margin-bottom:22px}
            .app-card .store img{height:42px}
            .footer-links{font-size:13px}
        }
    </style>
</head>
<body>
    <div class="apps-wrapper">
        <!-- Sudoku Card -->
        <section class="app-card">
            <div class="banner">
                <img src="logo_sudoku.png" alt="Sudoku Master">
            </div>
            <h1 class="app-title">Sudoku Master</h1>
            <p class="app-desc">An easy-to-play puzzle game</p>
            <div class="store">
                <a href="https://play.google.com/store/apps/details?id=com.xinye.game.sudoku">
                    <img src="google-store.png" alt="Google Play" title="Google Play">
                </a>
            </div>
        </section>

        <!-- Solitaire Card -->
        <section class="app-card">
            <div class="banner">
                <img src="logo_solitaire.png" alt="Poker Solitaire">
            </div>
            <h1 class="app-title">Poker Solitaire</h1>
            <p class="app-desc">Classic solitaire card game</p>
            <div class="store">
                <a href="https://play.google.com/store/apps/details?id=com.xinye.solitaire">
                    <img src="google-store.png" alt="Google Play" title="Google Play">
                </a>
            </div>
        </section>
    </div>

    <footer class="footer-section">
        <div class="footer-links">
            <a href="https://sites.google.com/view/jackyxqsudoku">Sudoku Privacy</a>
            <span class="split">|</span>
            <a href="solitaire_privacy.html">Solitaire Privacy</a>
            <span class="split">|</span>
            Contact:&nbsp;<a href="mailto:jackyxqlee@gmail.com">jackyxqlee@gmail.com</a>
        </div>
    </footer>
</body>
</html>
